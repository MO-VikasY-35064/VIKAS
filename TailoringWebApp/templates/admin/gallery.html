{% extends "admin/base.html" %}
{% block content %}
<h1>Gallery</h1>

<form method="post" enctype="multipart/form-data" class="card" style="max-width:500px;margin-bottom:24px;">
  <h4 class="mt-0">Add Gallery Image</h4>
  <label>Category</label>
  <input type="text" name="category" placeholder="Bridal / Party Wear / Traditional ...">
  <label>Description</label>
  <input type="text" name="description">
  <label>Display Order</label>
  <input type="number" name="display_order" value="0">
  <label>Image *</label>
  <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" required>
  <div class="form-actions"><button class="btn btn-sm" type="submit">Upload</button></div>
</form>

<div class="grid grid-4">
  {% for g in gallery %}
  <div class="card" style="padding:0;overflow:hidden;">
    <img src="{{ url_for('media', filename=g.image_path) }}" style="width:100%;height:160px;object-fit:cover;">
    <div style="padding:10px;">
      <span class="badge badge-{{ 'active' if g.is_active else 'inactive' }}">{{ 'Active' if g.is_active else 'Hidden' }}</span>
      <p style="font-size:13px;">{{ g.category }} - {{ g.description }}</p>
      <form method="post" action="{{ url_for('admin.toggle_gallery', gallery_id=g.id) }}">
        <button class="btn btn-sm btn-outline" type="submit">{{ 'Hide' if g.is_active else 'Show' }}</button>
      </form>
    </div>
  </div>
  {% else %}
    <p class="muted">No gallery images yet.</p>
  {% endfor %}
</div>
{% endblock %}
