<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link rel="manifest" href="{{ url_for('manifest') }}">
<meta name="theme-color" content="#4c1520">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background:var(--maroon-dark); min-height:100vh; display:flex; align-items:center; justify-content:center;">
<div class="card form-card" style="background:#fff;">
  <h2 style="text-align:center;">✂ Admin Login</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <div class="form-actions">
      <button class="btn" type="submit" style="width:100%;">Login</button>
    </div>
  </form>
  <p class="help-text" style="text-align:center;margin-top:16px;">Default demo login: admin / admin123</p>
</div>
</body>
</html>
