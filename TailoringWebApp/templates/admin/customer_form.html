{% extends "admin/base.html" %}
{% block content %}
<h1>Add Customer</h1>
<p class="muted">For walk-in customers or those registering by phone. They'll get a temporary
  password so they can log in online later if they want to track orders themselves.</p>

<form method="post" class="card form-card">
  <label>Mobile Number *</label>
  <input type="tel" name="mobile" pattern="[6-9][0-9]{9}" maxlength="10" required value="{{ form.mobile or '' }}">
  <label>Name</label>
  <input type="text" name="name" value="{{ form.name or '' }}">
  <label>Email</label>
  <input type="email" name="email" value="{{ form.email or '' }}">
  <label>Address</label>
  <textarea name="address" rows="2">{{ form.address or '' }}</textarea>
  <div class="form-actions">
    <button class="btn" type="submit">Add Customer</button>
    <a href="{{ url_for('admin.customers') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
